# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
    extensions:
        azure.ai.agents: '>=1.0.0-beta.17'
name: optimization-travel-approval-agent
services:
    ai-project:
        host: azure.ai.project
        deployments:
            - model:
                format: OpenAI
                name: gpt-6.1-sol
                version: "2026-09-29"
              name: gpt-6.1-sol
              sku:
                capacity: 250
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-6-astra
                version: "2026-09-03"
              name: gpt-6-astra
              sku:
                capacity: 250
                name: GlobalStandard
            - model:
                format: OpenAI
                name: gpt-5.6-sol
                version: "2026-07-09"
              name: gpt-5.6-sol
              sku:
                capacity: 50
                name: GlobalStandard
    travel-approval-agent:
        project: src/travel-approval-agent
        host: azure.ai.agent
        language: python
        uses:
            - ai-project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            OPTIMIZATION_LOCAL_DIR: .agent_configs
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: Applies the Contoso travel policy to trip requests and returns an approval decision.
        kind: hosted
        name: travel-approval-agent
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
