name: smoke-spec
agent:
    name: travel-approval-agent
    kind: hosted
    version: "10"
dataset:
    name: smoke-spec
    version: "1.0"
    local_uri: datasets/smoke-spec
evaluators:
    - name: smoke-spec
      version: "1"
      local_uri: evaluators/smoke-spec/rubric_dimensions.json
options:
    eval_model: gpt-6-astra
    optimization_config:
        model_search_space:
            - claude-sonnet-5-5
    optimization_model: gpt-5.6-sol
max_samples: 15
